<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear cuenta | ZitaJobs</title>
  <link rel="icon" href="assets/images/logo.jpg"/>
  <link rel="stylesheet" href="src/css/main.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
</head>
<body>
  <div id="navbar-root"></div>

  <div class="auth-page" style="padding: 2rem 1rem;">
    <canvas id="auth-canvas" class="auth-bg-canvas"></canvas>

    <div class="auth-card" style="max-width:500px;">
      <div style="text-align:center; margin-bottom:1.5rem;">
        <img src="assets/images/logo.jpg" alt="" style="width:52px;height:52px;object-fit:contain;border-radius:12px;margin:0 auto 0.75rem;">
        <h1 style="font-family:var(--font-display);font-size:1.5rem;font-weight:800;margin-bottom:0.25rem;">Crear cuenta</h1>
        <p style="color:var(--text-muted);font-size:0.875rem;">Regístrate para encontrar o publicar empleos</p>
      </div>

      <!-- Role selector -->
      <div class="form-group">
        <label class="form-label">¿Cómo usarás ZitaJobs?</label>
        <div class="role-selector">
          <label class="role-option">
            <input type="radio" name="role" value="candidato" checked/>
            <div class="role-label">
              <span class="role-icon">👤</span>
              <span class="role-name">Busco empleo</span>
              <span style="font-size:0.72rem; color:var(--text-muted);">Candidato</span>
            </div>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="empresa"/>
            <div class="role-label">
              <span class="role-icon">🏢</span>
              <span class="role-name">Soy empresa</span>
              <span style="font-size:0.72rem; color:var(--text-muted);">Reclutador</span>
            </div>
          </label>
        </div>
      </div>

      <div id="form-error" class="alert alert-error hidden mb-4"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name" id="name-label">Nombre completo</label>
          <input type="text" id="name" class="form-input" placeholder="Juan Pérez" required autocomplete="name"/>
        </div>

        <!-- Empresa-only fields (hidden by default) -->
        <div id="empresa-fields" class="hidden">
          <div class="form-group">
            <label class="form-label" for="companyName">Nombre de la empresa</label>
            <input type="text" id="companyName" class="form-input" placeholder="Mi Empresa S.A. de C.V."/>
          </div>
          <div class="form-group">
            <label class="form-label" for="sector">Sector / Industria</label>
            <select id="sector" class="form-select">
              <option value="">Seleccionar sector</option>
              <option>Manufactura</option>
              <option>Tecnología</option>
              <option>Comercio</option>
              <option>Servicios</option>
              <option>Educación</option>
              <option>Salud</option>
              <option>Construcción</option>
              <option>Agropecuario</option>
              <option>Otro</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-input" placeholder="correo@ejemplo.com" required autocomplete="email"/>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Teléfono <span style="font-weight:400;color:var(--text-muted);">(opcional)</span></label>
          <input type="tel" id="phone" class="form-input" placeholder="715 123 4567"/>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña <span style="font-weight:400;color:var(--text-muted);">mín. 6 caracteres</span></label>
          <div class="input-group">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required style="padding-left:1rem;"/>
            <button type="button" id="toggle-pw" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);">👁</button>
          </div>
          <div id="pw-strength" style="height:4px; border-radius:4px; margin-top:0.4rem; background:var(--border); overflow:hidden;">
            <div id="pw-bar" style="height:100%; width:0; transition:width 0.3s, background 0.3s;"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="check-row" for="accept-terms">
            <input type="checkbox" id="accept-terms" required/>
            <span>Acepto el <a href="aviso-privacidad.html" target="_blank" rel="noopener">Aviso de privacidad</a> y los <a href="terminos.html" target="_blank" rel="noopener">Términos y condiciones</a>.</span>
          </label>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg mt-2">
          Crear cuenta gratis
        </button>
      </form>

      <p style="text-align:center; font-size:0.875rem; color:var(--text-muted); margin-top:1.25rem;">
        ¿Ya tienes cuenta?
        <a href="ingresar.html" style="color:var(--zita-primary); font-weight:600;">Inicia sesión</a>
      </p>
    </div>
  </div>

  <script src="src/js/config.js"></script>
  <script type="module" src="src/js/pages/crear-cuenta.js"></script>
</body>
</html>
