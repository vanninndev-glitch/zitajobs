<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Moderación | ZitaJobs</title>
  <link rel="icon" href="assets/images/logo.jpg"/>
  <link rel="stylesheet" href="src/css/main.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page-main">
    <div class="container" style="padding-top:2rem; padding-bottom:3rem;">
      <div class="mb-6">
        <h1 style="font-family:var(--font-display); font-size:1.75rem; font-weight:900; margin-bottom:0.25rem;">Moderación</h1>
        <p class="text-muted">Revisa vacantes, atiende reportes y verifica empresas.</p>
      </div>

      <div class="stats-grid mb-6">
        <div class="stat-card primary"><div class="stat-number" id="ov-review">—</div><div class="stat-label">Vacantes por revisar</div></div>
        <div class="stat-card cyan"><div class="stat-number" id="ov-reports">—</div><div class="stat-label">Reportes abiertos</div></div>
        <div class="stat-card yellow"><div class="stat-number" id="ov-unverified">—</div><div class="stat-label">Empresas sin verificar</div></div>
        <div class="stat-card green"><div class="stat-number" id="ov-live">—</div><div class="stat-label">Vacantes publicadas</div></div>
      </div>

      <div class="admin-tabs" role="tablist">
        <button class="admin-tab active" data-tab="jobs" role="tab">Vacantes <span class="admin-count hidden" id="cnt-jobs"></span></button>
        <button class="admin-tab" data-tab="reports" role="tab">Reportes <span class="admin-count hidden" id="cnt-reports"></span></button>
        <button class="admin-tab" data-tab="companies" role="tab">Empresas</button>
      </div>

      <section id="tab-jobs">
        <div class="flex items-center gap-2 mb-4">
          <label class="form-label" for="jobs-filter" style="margin:0;">Mostrar:</label>
          <select id="jobs-filter" class="form-select" style="width:auto;">
            <option value="pendiente,en_revision">Por revisar</option>
            <option value="rechazada">Rechazadas</option>
          </select>
        </div>
        <div id="jobs-list"></div>
      </section>

      <section id="tab-reports" class="hidden"><div id="reports-list"></div></section>

      <section id="tab-companies" class="hidden">
        <div class="flex flex-wrap items-center gap-2 mb-4">
          <input type="text" id="company-q" class="form-input" placeholder="Buscar por empresa o correo" style="max-width:280px;"/>
          <select id="company-filter" class="form-select" style="width:auto;">
            <option value="false">Sin verificar</option>
            <option value="true">Verificadas</option>
            <option value="">Todas</option>
          </select>
        </div>
        <div id="companies-list"></div>
      </section>
    </div>
  </main>

  <script src="src/js/config.js"></script>
  <script type="module" src="src/js/pages/admin.js"></script>
</body>
</html>
