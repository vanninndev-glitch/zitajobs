<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Nueva contraseña | ZitaJobs</title>
  <link rel="icon" href="assets/images/logo.jpg"/>
  <link rel="stylesheet" href="src/css/main.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
</head>
<body>
  <div id="navbar-root"></div>

  <div class="auth-page">
    <canvas id="auth-canvas" class="auth-bg-canvas"></canvas>

    <div class="auth-card">
      <div style="text-align:center; margin-bottom:1.75rem;">
        <img src="assets/images/logo.jpg" alt="ZitaJobs" style="width:56px;height:56px;object-fit:contain;border-radius:12px;margin:0 auto 0.75rem;">
        <h1 style="font-family:var(--font-display);font-size:1.5rem;font-weight:800;margin-bottom:0.25rem;">Crea tu nueva contraseña</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;">Elige una contraseña de al menos 6 caracteres.</p>
      </div>

      <div id="form-error" class="alert alert-error hidden mb-4"></div>
      <div id="form-success" class="alert alert-success hidden mb-4"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">Nueva contraseña</label>
          <div class="input-group">
            <span class="input-group-icon">🔒</span>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="new-password" style="padding-left:2.75rem;"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password2">Repite la contraseña</label>
          <div class="input-group">
            <span class="input-group-icon">🔒</span>
            <input type="password" id="password2" class="form-input" placeholder="••••••••" required autocomplete="new-password" style="padding-left:2.75rem;"/>
          </div>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem;">Guardar contraseña</button>
      </form>

      <p style="text-align:center; font-size:0.875rem; color:var(--text-muted); margin-top:1.25rem;"><a href="olvide-contrasena.html" style="color:var(--zita-primary); font-weight:600;">Solicitar un enlace nuevo</a></p>
    </div>
  </div>

  <script src="src/js/config.js"></script>
  <script type="module" src="src/js/pages/restablecer-contrasena.js"></script>
</body>
</html>
