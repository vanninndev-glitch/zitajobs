<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ingresar | ZitaJobs</title>
  <link rel="icon" href="assets/images/logo.jpg"/>
  <link rel="stylesheet" href="src/css/main.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
</head>
<body>
  <div id="navbar-root"></div>

  <div class="auth-page">
    <canvas id="auth-canvas" class="auth-bg-canvas"></canvas>

    <div class="auth-card">
      <div style="text-align:center; margin-bottom:1.75rem;">
        <img src="assets/images/logo.jpg" alt="ZitaJobs" style="width:56px;height:56px;object-fit:contain;border-radius:12px;margin:0 auto 0.75rem;">
        <h1 style="font-family:var(--font-display);font-size:1.5rem;font-weight:800;margin-bottom:0.25rem;">Iniciar sesión</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;">Accede a tu cuenta de ZitaJobs</p>
      </div>

      <div id="form-error" class="alert alert-error hidden mb-4"></div>
      <div id="form-success" class="alert alert-success hidden mb-4"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-icon">✉️</span>
            <input type="email" id="email" class="form-input" placeholder="correo@ejemplo.com" required autocomplete="email"/>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-group">
            <span class="input-group-icon">🔒</span>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="padding-left:2.75rem;"/>
            <button type="button" id="toggle-password" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1rem;">👁</button>
          </div>
        </div>

        <p style="text-align:right; font-size:0.82rem; margin:-0.25rem 0 0.5rem;">
          <a href="olvide-contrasena.html" style="color:var(--zita-primary); font-weight:600;">¿Olvidaste tu contraseña?</a>
        </p>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem;">
          Ingresar
        </button>
      </form>

      <p style="text-align:center; font-size:0.875rem; color:var(--text-muted); margin-top:1.25rem;">
        ¿No tienes cuenta?
        <a href="crear-cuenta.html" style="color:var(--zita-primary); font-weight:600;">Crear cuenta gratis</a>
      </p>
    </div>
  </div>

  <script src="src/js/config.js"></script>
  <script type="module" src="src/js/pages/ingresar.js"></script>
</body>
</html>
